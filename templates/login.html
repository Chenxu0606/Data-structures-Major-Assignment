<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Zhice-管理员登录端</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(at 0% 0%, #E5E9F2 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #D7E8D5 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #AFC7B4 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #C8D5DD 0px, transparent 50%),
                        #E5E9F2;
            background-attachment: fixed;
            font-family: -apple-system, sans-serif; color: #132219;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(74, 99, 83, 0.15); width: 400px; padding: 40px; box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #384F41; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.2);
            border-radius: 10px; font-size: 15px; box-sizing: border-box; color: #132219; outline: none;
        }
        .btn-submit { width: 100%; padding: 14px; background: #132219; color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="glass-card">
    <h2>系统安全登录认证</h2>
    <div class="form-group">
        <label>管理员账号</label>
        <input type="text" id="username" placeholder="请输入核心账户">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入安全密码" onkeyup="if(event.keyCode==13) performLogin()">
    </div>
    <button class="btn-submit" onclick="performLogin()">登录</button>
</div>

<script>
    function performLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(!u.trim() || !p.trim()) { alert("账号或密码不能为空！"); return; }

        fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        })
        .then(res => res.json())
        .then(res => {
            if(res.code === 200) { window.location.href = '/admin'; }
            else { alert(res.msg); }
        });
    }
</script>
</body>
</html>
