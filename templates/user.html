<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhice-自助取号端</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(at 0% 0%, #E5E9F2 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #D7E8D5 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #AFC7B4 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #C8D5DD 0px, transparent 50%),
                        #E5E9F2;
            background-attachment: fixed; font-family: -apple-system, sans-serif; color: #132219;
            position: relative; overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(74, 99, 83, 0.15); max-width: 450px; width: 100%; padding: 40px 30px; text-align: center; box-sizing: border-box;
        }
        h2 { margin-bottom: 30px; font-weight: 600; }
        .input-group { margin-bottom: 30px; text-align: left; }
        label { font-weight: bold; color: #384F41; display: block; margin-bottom: 12px; }
        input[type="number"] {
            width: 100%; padding: 14px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255,255,255,0.2);
            border-radius: 12px; font-size: 16px; color: #132219; font-weight: bold; box-sizing: border-box; outline: none;
        }
        .btn-zone { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 14px; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #132219; color: white; }
        .btn-vip { background: #D9A74A; color: white; }
        .back-home { margin-top: 25px; display: inline-block; color: #132219; text-decoration: none; font-weight: 600; font-size: 14px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(19, 34, 25, 0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            padding: 35px; width: 85%; max-width: 400px; text-align: center;
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #132219; }
        .ticket-divider { border-top: 1px dashed rgba(0, 0, 0, 0.15); margin: 15px 0; }
        .info-row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; }
        .info-label { color: #556B5C; }
        .info-value { font-weight: bold; color: #132219; }
        .info-value.big { font-size: 32px; font-family: monospace; color: #132219; display: block; margin: 10px 0; text-align: center; width: 100%; }
        .btn-close { width: 100%; padding: 12px; background: #132219; color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="glass-card">
    <h2>点击下方取号</h2>
    <div class="input-group">
        <label for="people-count">请输入就餐总人数：</label>
        <input type="number" id="people-count" value="1" min="1" max="20">
    </div>
    <div class="btn-zone">
        <button class="btn btn-primary" onclick="submitTicket('normal')">普通取号</button>
        <button class="btn btn-vip" onclick="submitTicket('VIP')">VIP取号</button>
    </div>
    <a href="/" class="back-home">返回首页</a>
</div>

<div id="ticket-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-title">取号凭证打印成功</div>
        <div class="ticket-divider"></div>

        <div class="info-row">
            <span class="info-label" style="align-self: center;">您的排队号码：</span>
        </div>
        <span id="res-number" class="info-value big">A000</span>

        <div class="info-row">
            <span class="info-label">桌型：</span>
            <span id="res-category" class="info-value">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">前方等待桌数：</span>
            <span id="res-ahead" class="info-value">0 桌</span>
        </div>
        <div class="info-row">
            <span class="info-label">预测时间：</span>
            <span id="res-time" class="info-value" style="color: #C95B53;">约 0 分钟</span>
        </div>

        <div class="ticket-divider"></div>
        <p style="font-size: 12px; color: #556B5C; margin: 0;">提示：请留意大屏广播叫号</p>
        <button class="btn-close" onclick="closeModal()">好的</button>
    </div>
</div>

<script>
    function submitTicket(type) {
        const countInput = document.getElementById('people-count').value;
        if (!countInput || countInput <= 0) { alert("请输入正确的用餐人数！"); return; }

        fetch('/api/queue/take', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: type, people_count: countInput })
        })
        .then(res => res.json())
        .then(res => {
            if (res.code === 200) {
                document.getElementById('res-number').innerText = res.data.queue_number;
                document.getElementById('res-category').innerText = res.data.table_category;
                document.getElementById('res-ahead').innerText = res.data.ahead_count + " 桌";
                document.getElementById('res-time').innerText = `约 ${res.data.predict_time} 分钟`;

                document.getElementById('ticket-modal').classList.add('active');
            }
        });
    }

    function closeModal() {
        document.getElementById('ticket-modal').classList.remove('active');
        document.getElementById('people-count').value = "1";
    }
</script>
</body>
</html>
