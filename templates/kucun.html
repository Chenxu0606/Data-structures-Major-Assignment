<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Zhice-库存管理页</title>
    <style>
        body {
            margin: 0; min-height: 100vh; padding: 40px 20px; box-sizing: border-box;
            background: radial-gradient(at 0% 0%, #E5E9F2 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #D7E8D5 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #AFC7B4 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #C8D5DD 0px, transparent 50%),
                        #E5E9F2;
            background-attachment: fixed; font-family: -apple-system, sans-serif; color: #132219;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { padding: 10px 20px; background: transparent; border: 1px solid #132219; border-radius: 20px; text-decoration: none; color: #132219; font-weight: bold; }
        .glass-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(74, 99, 83, 0.15); padding: 30px; margin-bottom: 30px;
        }
        .input-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }

        input[type="text"], input[type="date"] {
            flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.2); border-radius: 10px;
            color: #132219; outline: none; font-size: 14px; font-family: inherit;
            box-sizing: border-box;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer; opacity: 0.6; filter: invert(10%) sepia(20%) saturate(600%) hue-rotate(85deg);
        }

        .btn-ctrl { padding: 12px 25px; background: #132219; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; height: 44px; }
        .action-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-secondary { background: transparent; border: 1px solid #132219; color: #132219; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px; border-bottom: 2px solid rgba(0,0,0,0.08); color: #384F41; }
        td { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .expired-tr { background: rgba(201, 91, 83, 0.15); color: #C95B53; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h2>仓库库存管理</h2>
        <a href="/admin" class="btn-back">返回主菜单</a>
    </div>

    <div class="glass-card">
        <h3>食材登记入库</h3>
        <div class="input-row">
            <input type="text" id="food-name" placeholder="请输入食材名称" style="flex: 1.5;">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 11px; color:#384F41; font-weight: bold; padding-left:4px;">入库日期</span>
                <input type="date" id="in-time">
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 11px; color:#384F41; font-weight: bold; padding-left:4px;">保质期至</span>
                <input type="date" id="exp-time">
            </div>
            <button class="btn-ctrl" onclick="addFoodItem()" style="align-self: flex-end;">确认登记</button>
        </div>
    </div>

    <div class="glass-card">
        <div class="action-bar">
            <button class="btn-ctrl" onclick="sortInventory()">按保质期智能排序</button>
            <button class="btn-ctrl btn-secondary" onclick="clearExpired()">一键清理过期食材</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>食材名称</th>
                    <th>入库时间</th>
                    <th>过期时间</th>
                    <th>食材状态</th>
                    <th>管理库存</th>
                </tr>
            </thead>
            <tbody id="inventory-tbody"></tbody>
        </table>
    </div>
</div>

<script {nonce}>
    function initDateInputs() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('in-time').value = today;
        document.getElementById('exp-time').value = today;
    }

    function renderTable(data) {
        const tbody = document.getElementById('inventory-tbody');
        tbody.innerHTML = data.map(item => `
            <tr class="${item.status === 'expired' ? 'expired-tr' : ''}">
                <td># ${item.id}</td>
                <td><b>${item.food_name}</b></td>
                <td>${item.in_time}</td>
                <td>${item.exp_time}</td>
                <td>${item.status === 'expired' ? '已过期' : '未过期'}</td>
                <td><button style="color:#C95B53; cursor:pointer; background:transparent; border:none; font-weight:bold;" onclick="deleteItem(${item.id})">移除</button></td>
            </tr>
        `).join('');
    }

    function refreshData() {
        fetch('/api/kucun/list')
            .then(res => res.json())
            .then(res => {
                if(res.code === 200 && res.data) {
                    renderTable(res.data);
                }
            });
    }

    function addFoodItem() {
        const n = document.getElementById('food-name').value;
        const i = document.getElementById('in-time').value;
        const e = document.getElementById('exp-time').value;
        if(!n || !i || !e) { alert("请完整填写食物名称与对应日期！"); return; }
        if(new Date(e) < new Date(i)) { alert("错误：质保到期日期不能早于入库日期！"); return; }

        fetch('/api/kucun/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({food_name: n, in_time: i, exp_time: e})
        }).then(() => {
            document.getElementById('food-name').value = "";
            refreshData();
        });
    }

    function deleteItem(id) {
        fetch('/api/kucun/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        }).then(() => refreshData());
    }

    function sortInventory() {
        fetch('/api/kucun/sort', { method: 'POST' })
            .then(res => res.json())
            .then(res => {
                if(res.code === 200 && res.data) {
                    renderTable(res.data);
                }
            });
    }

    function clearExpired() {
        fetch('/api/kucun/clear_expired', { method: 'POST' }).then(() => refreshData());
    }

    window.onload = function() {
        initDateInputs();
        refreshData();
    };
</script>
</body>
</html>
