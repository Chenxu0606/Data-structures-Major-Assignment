<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>库存管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>库存管理系统</h1>

        <input id="foodName" placeholder="输入食材名称">

        <button onclick="addFood()">新增食材</button>

        <div id="foodList"></div>

        <button style="margin-top:20px;background:#e74c3c"
                onclick="deleteExpired()">
            删除过期食材
        </button>

        <div class="button-group">
            <button class="back-btn" onclick="location.href='/admin'">
                返回
            </button>
        </div>

    </div>
</div>

<script src="/js/kucun.js"></script>

</body>
</html>
