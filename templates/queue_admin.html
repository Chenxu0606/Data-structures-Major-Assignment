<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Zhice-排队信息管理页</title>
    <style>
        body {
            margin: 0; min-height: 100vh; padding: 40px 20px; box-sizing: border-box;
            background: radial-gradient(at 0% 0%, #E5E9F2 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #D7E8D5 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #AFC7B4 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #C8D5DD 0px, transparent 50%),
                        #E5E9F2;
            background-attachment: fixed;
            font-family: -apple-system, sans-serif; color: #132219;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { padding: 10px 20px; background: transparent; border: 1px solid #132219; border-radius: 20px; text-decoration: none; color: #132219; font-weight: bold; }

        .glass-card {
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(74, 99, 83, 0.15); padding: 30px; margin-bottom: 30px;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px; border-bottom: 2px solid rgba(0,0,0,0.08); color: #384F41; }
        td { padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }

        .btn-op { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .btn-call { background: #7CA18C; color: white; }
        .btn-jump { background: #C95B53; color: white; }
        .btn-miss { background: #666666; color: white; }
        .btn-recover { background: #D9A74A; color: white; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-waiting { background: rgba(124,161,140,0.2); color: #384F41; }
        .status-called { background: rgba(0,0,0,0.05); color: #666; text-decoration: line-through; }
        .status-missed { background: rgba(201,91,83,0.15); color: #C95B53; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <h2>排队信息管理端</h2>
        <a href="/admin" class="btn-back">返回主菜单</a>
    </div>

    <div class="glass-card">
        <h3>全量客服调度面板</h3>
        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>排队号码</th>
                    <th>桌型</th>
                    <th>状态</th>
                    <th>顾客类型</th>
                    <th>叫号控制</th>
                </tr>
            </thead>
            <tbody id="queue-tbody"></tbody>
        </table>
    </div>
</div>

<script>
    function loadQueueData() {
        fetch('/api/queue/all_status_for_screen')
            .then(res => res.json())
            .then(res => {
                if(res.code === 200) {
                    const tbody = document.getElementById('queue-tbody');
                    tbody.innerHTML = res.data.map(node => {
                        let statusText = '';
                        let opButtons = '';

                        if (node.status === 'waiting') {
                            statusText = `<span class="status-tag status-waiting">等待中</span>`;
                            opButtons = `
                                <button class="btn-op btn-call" onclick="operateNode(${node.id}, 'call')">呼叫</button>
                                <button class="btn-op btn-jump" onclick="operateNode(${node.id}, 'jump')">插队</button>
                                <button class="btn-op btn-miss" onclick="operateNode(${node.id}, 'miss')">过号</button>
                            `;
                        } else if (node.status === 'called') {
                            statusText = `<span class="status-tag status-called">已就餐</span>`;
                            opButtons = `<span style="color: #999; font-size: 13px;">流程已结束</span>`;
                        } else if (node.status === 'missed') {
                            statusText = `<span class="status-tag status-missed">已过号</span>`;
                            opButtons = `
                                <button class="btn-op btn-recover" onclick="operateNode(${node.id}, 'recover')">恢复归队(插至第3位)</button>
                            `;
                        }

                        return `
                            <tr>
                                <td>${node.id}</td>
                                <td><b>${node.queue_number}</b></td>
                                <td>${node.table_category === 'A' ? '小桌' : (node.table_category === 'B' ? '中桌' : '大桌')}</td>
                                <td>${statusText}</td>
                                <td>${node.queue_type}</td>
                                <td>${opButtons}</td>
                            </tr>
                        `;
                    }).join('');
                }
            });
    }

    function operateNode(id, action) {
        fetch('/api/queue/operate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id, action: action})
        }).then(() => loadQueueData());
    }

    window.onload = function() {
        loadQueueData();
        setInterval(loadQueueData, 3000);
    };
</script>
</body>
</html>
