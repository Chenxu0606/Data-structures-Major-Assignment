<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员菜单面板</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #f5f5f7; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; }
        .floating-bubbles { position: fixed; width: 100vw; height: 100vh; z-index: 1; filter: blur(140px); background: #fff; }
        .bubble { position: absolute; border-radius: 50%; opacity: 0.5; width: 70vw; height: 70vw; background: radial-gradient(circle, #a9ff62 0%, transparent 75%); bottom: -20%; left: -10%; }
        .container { position: relative; z-index: 10; width: 80vw; max-width: 900px; background: rgba(255,255,255,0.45); backdrop-filter: blur(30px); border-radius: 28px; padding: 45px; text-align: center; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 12px 40px rgba(0,0,0,0.02); }
        h2 { font-size: 32px; margin-bottom: 35px; font-weight: 700; }
        .menu-grid { display: flex; gap: 20px; justify-content: center; }
        .menu-btn { flex: 1; padding: 22px; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 16px; transition: all 0.2s; text-align: center; }
        .btn-call { background: #007AFF; color: white; }
        .btn-stock { background: #34C759; color: white; }
        .btn-back { background: #8e8e93; color: white; }
        .menu-btn:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="floating-bubbles"><div class="bubble"></div></div>
    <div class="container">
        <h2>管理员控制面板</h2>
        <div class="menu-grid">
            <a href="/queue_admin" class="menu-btn btn-call">叫号管理</a>
            <a href="/kucun" class="menu-btn btn-stock">库存管理</a>
            <a href="/login" class="menu-btn btn-back">返回首页</a>
        </div>
    </div>
</body>
</html>
